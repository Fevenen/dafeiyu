[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu-bridge"
version = "0.2.1"
description = "Portable desktop companion routing, QQ messaging and reminders"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["requests>=2.32,<3", "pypinyin>=0.50,<1", "rapidfuzz>=3,<4", "mcp>=1.6,<3"]

[project.scripts]
dafeiyu-doctor = "bridge.doctor:main"
dafeiyu-gateway = "bridge.kvmem_proxy:main"
dafeiyu-start = "bridge.launcher:main"

[tool.setuptools.packages.find]
include = ["bridge*"]
