name: Offline regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test frontend/scripts/test-screen-vision.mjs
      - run: node --test frontend/scripts/test-playback.mjs
      - run: node --test sillytavern-extension/tests/controller.test.js
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
        mcp: ['mcp>=1.6,<2', 'mcp>=2,<3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt "${{ matrix.mcp }}"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
