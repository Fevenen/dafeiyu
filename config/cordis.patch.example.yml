# Installer generates concrete machine-specific paths under bridge/data/generated/.
- insert:
    - id: preset-dafeiyu
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dafeiyu
        name: 大肥鱼（桌宠）
        description: 桌宠聊天、QQ 消息与提醒
        order: 5
        plugins:
          - id: mcp
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: pet-bridge
              transport: stdio
              command: '<PYTHON_EXE>'
              args:
                - '<BRIDGE_SERVER>'
              toolCallTimeoutMs: 120000
